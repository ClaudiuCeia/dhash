name: Publish JSR

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-jsr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Verify tag matches deno.json version
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.tag || github.ref_name }}"
          tag="${raw_tag#v}"
          version="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")"

          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag (${raw_tag}) does not match deno.json version (${version})."
            exit 1
          fi

      - name: Check
        run: deno task check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Publish to JSR
        shell: bash
        run: |
          version="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")"
          if deno eval "const r = await fetch('https://jsr.io/@claudiu-ceia/dhash/${version}_meta.json'); Deno.exit(r.ok ? 0 : 1)"; then
            echo "@claudiu-ceia/dhash@${version} is already published to JSR."
          else
            deno publish
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          prev_tag="$(
            git tag --list "v*" --sort=-version:refname \
              | grep -v "^${tag}$" \
              | head -n 1 || true
          )"

          {
            echo "# ${tag}"
            echo
            if [[ -n "${prev_tag}" ]]; then
              echo "Changes since ${prev_tag}:"
              echo
              git log --no-merges --pretty=format:"- %s (%h)" "${prev_tag}..${tag}"
            else
              echo "Changes:"
              echo
              git log --no-merges --pretty=format:"- %s (%h)" "${tag}"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
