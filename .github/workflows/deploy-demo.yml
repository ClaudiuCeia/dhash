name: Deploy Demo (Deno Deploy)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Check
        run: deno task check

      - name: Prepare deployment marker
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('docs/deno.json')).imports.dhash_jsr.match(/@\\^?(\\d+\\.\\d+\\.\\d+)/)?.[1] ?? '')")"
          if [[ -z "${version}" ]]; then
            echo "Could not determine the demo library version."
            exit 1
          fi
          DEPLOY_SHA="${sha}" deno eval \
            'Deno.writeTextFileSync("docs/deployment.json", JSON.stringify({ sha: Deno.env.get("DEPLOY_SHA") }, null, 2) + "\n")'
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno run --no-lock -A jsr:@deno/deploy@0.0.9904 --config docs/deno.json --prod docs

      - name: Smoke test
        env:
          DEMO_URL: https://dhash.claudiuceia.deno.net
          EXPECTED_DEPLOY_SHA: ${{ steps.deployment.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.deployment.outputs.version }}
        run: >-
          deno run
          --allow-env=DEMO_URL,EXPECTED_DEPLOY_SHA,EXPECTED_VERSION
          --allow-net=dhash.claudiuceia.deno.net
          --allow-read=tests/earthrise.jpg
          scripts/smoke_demo.ts
