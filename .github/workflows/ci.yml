name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: [1.4.0, latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Verify Bun package runtime
        run: |
          bun --eval '
            import { compare, dhash } from "@claudiu-ceia/dhash";
            const hash = await dhash("./tests/earthrise.jpg");
            if (hash !== "0018001a5a0000fc" || compare(hash, hash) !== 0) {
              throw new Error("Bun package runtime check failed");
            }
          '

  deno:
    name: Deno ${{ matrix.deno-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deno-version: [2.6.8, v2.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check
        run: deno task check

      - name: Verify Deno package runtime
        run: |
          deno eval '
            import { compare, dhash } from "@claudiu-ceia/dhash";
            const hash = await dhash("./tests/earthrise.jpg");
            if (hash !== "0018001a5a0000fc" || compare(hash, hash) !== 0) {
              throw new Error("Deno package runtime check failed");
            }
          '

      - name: Validate package
        run: deno publish --dry-run

  npm:
    name: npm (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Validate npm package
        run: deno task check:npm
