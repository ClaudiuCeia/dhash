name: Publish to JSR

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-jsr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Verify tag matches deno.json version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          version="$(python -c 'import json; print(json.load(open("deno.json"))["version"])')"

          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match deno.json version (${version})."
            exit 1
          fi

      - name: Format / Lint / Test
        run: |
          deno fmt --check
          deno lint
          deno task test

      - name: Publish
        run: |
          # Tokenless publishing requires linking the JSR package to this GitHub repository
          # in the package settings on jsr.io, and OIDC enabled via `id-token: write`.
          deno publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
